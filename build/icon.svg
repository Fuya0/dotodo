<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    DoTodo 应用图标：与界面里的品牌方块同源。
    几何形状由 tools/make-tray-icon.js 用有符号距离场复现，改这里记得同步改那里。
  -->
  <defs>
    <linearGradient id="surface" x1="200" y1="160" x2="824" y2="880" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="100" y="110" width="824" height="856" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#08203A" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect
    x="192"
    y="192"
    width="640"
    height="640"
    rx="192"
    fill="url(#surface)"
    filter="url(#shadow)"
  />
  <path
    d="M368 528l96 96 200-224"
    fill="none"
    stroke="#06121F"
    stroke-width="72"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>

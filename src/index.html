<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
    <title>DoTodo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <div id="runtimeWarning" class="runtime-warning" role="status" hidden></div>
      <header class="titlebar">
        <div class="brand" aria-label="DoTodo">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
          <span>DoTodo</span>
        </div>
        <div class="window-actions">
          <button id="settingsButton" class="icon-button" aria-label="设置" aria-expanded="false" title="设置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.25A3.25 3.25 0 1 0 12 8.75a3.25 3.25 0 0 0 0 6.5Z"/><path d="M19.4 13.5a7.9 7.9 0 0 0 .05-3l1.4-1.08-2-3.46-1.72.7a8.3 8.3 0 0 0-2.6-1.5L14.27 3h-4l-.27 2.16a8.3 8.3 0 0 0-2.6 1.5l-1.72-.7-2 3.46 1.4 1.08a7.9 7.9 0 0 0 .05 3l-1.45 1.08 2 3.46 1.77-.72a8.3 8.3 0 0 0 2.55 1.47l.27 2.21h4l.27-2.21a8.3 8.3 0 0 0 2.55-1.47l1.77.72 2-3.46-1.45-1.08Z"/></svg>
          </button>
          <button id="minimizeButton" class="icon-button" aria-label="最小化" title="最小化"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
          <button id="closeButton" class="icon-button close-button" aria-label="关闭" title="关闭"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
        </div>
      </header>

      <section id="settingsPanel" class="settings-panel" aria-hidden="true">
        <div class="setting-row">
          <label for="opacitySlider">透明度</label>
          <div class="range-wrap">
            <input id="opacitySlider" type="range" min="55" max="100" step="1" />
            <output id="opacityValue" for="opacitySlider">94%</output>
          </div>
        </div>
        <label class="setting-row switch-row">
          <span>始终置顶</span>
          <input id="alwaysOnTopToggle" type="checkbox" role="switch" />
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="setting-row switch-row">
          <span>开机启动</span>
          <input id="launchAtLoginToggle" type="checkbox" role="switch" />
          <span class="switch" aria-hidden="true"></span>
        </label>
      </section>

      <section class="content">
        <div class="hero">
          <p id="dateLabel" class="eyebrow"></p>
          <div class="heading-row">
            <h1>今天要做</h1>
            <span id="progressLabel" class="progress-label">0 / 0</span>
          </div>
          <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
        </div>

        <form id="todoForm" class="todo-form">
          <span class="add-icon" aria-hidden="true">＋</span>
          <input id="todoInput" maxlength="240" autocomplete="off" placeholder="添加一件要做的事…" aria-label="新待办" />
          <button type="submit">添加</button>
        </form>

        <nav class="filters" aria-label="待办筛选">
          <button class="filter active" data-filter="all">全部</button>
          <button class="filter" data-filter="active">未完成</button>
          <button class="filter" data-filter="completed">已完成</button>
          <button id="clearCompleted" class="clear-completed">清除已完成</button>
        </nav>

        <div id="todoList" class="todo-list" aria-live="polite"></div>
        <section id="emptyState" class="empty-state">
          <div class="empty-check" aria-hidden="true"><span></span></div>
          <h2>清单空空的</h2>
          <p>写下一件小事，然后轻松完成它。</p>
        </section>
      </section>

      <footer><span>双击文字可编辑</span><kbd>Ctrl/⌘ N</kbd></footer>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>

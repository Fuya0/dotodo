<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>DoTodo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <div id="runtimeWarning" class="runtime-warning" role="status" hidden></div>

      <header class="titlebar">
        <div class="brand" aria-label="DoTodo">
          <span class="brand-mark" aria-hidden="true"><i></i></span>
          <span>DoTodo</span>
        </div>
        <div class="window-actions">
          <button id="layerButton" class="icon-button" type="button" aria-label="切换窗口层级" aria-pressed="true" title="切换窗口层级">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z" /><path d="m3 13 9 5 9-5" /></svg>
          </button>
          <button id="settingsButton" class="icon-button" type="button" aria-label="设置" aria-expanded="false" title="设置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" /><path d="M12 3.5v2M12 18.5v2M4.9 7.8l1.7 1M17.4 15.2l1.7 1M4.9 16.2l1.7-1M17.4 8.8l1.7-1" /></svg>
          </button>
          <button id="minimizeButton" class="icon-button" type="button" aria-label="最小化" title="最小化">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
          </button>
          <button id="closeButton" class="icon-button close-button" type="button" aria-label="关闭" title="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
          </button>
        </div>
      </header>

      <section class="content" id="todayPage" aria-label="今天的清单">
        <div class="hero">
          <p id="dateLabel" class="eyebrow"></p>
          <div class="heading-row">
            <h1>今天要做</h1>
            <span id="progressLabel" class="progress-label">0 / 0</span>
          </div>
          <div
            id="progressTrack"
            class="progress-track"
            role="progressbar"
            aria-label="今日完成进度"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <span id="progressBar"></span>
          </div>
        </div>

        <form id="todoForm" class="todo-form" autocomplete="off">
          <span class="add-icon" aria-hidden="true">＋</span>
          <input id="todoInput" maxlength="240" placeholder="添加一件要做的事…" aria-label="新任务" />
          <button type="submit">添加</button>
        </form>

        <div id="errorArea" class="error-area" role="alert" hidden></div>

        <div id="todoList" class="todo-list" role="listbox" aria-label="今天的任务" aria-live="polite"></div>

        <section id="emptyState" class="empty-state">
          <div class="empty-check" aria-hidden="true"><span></span></div>
          <h2 id="emptyTitle">清单空空的</h2>
          <p id="emptyCopy">写下一件小事，然后轻松完成它。</p>
        </section>
      </section>

      <section class="content" id="historyPage" aria-label="历史记录" hidden>
        <div class="hero">
          <p class="eyebrow">历史</p>
          <div class="heading-row">
            <h1>过去的清单</h1>
            <span id="historyCount" class="progress-label">0 天</span>
          </div>
        </div>

        <div id="historyList" class="history-list" aria-live="polite"></div>

        <section id="historyEmpty" class="empty-state" hidden>
          <div class="empty-check" aria-hidden="true"><span></span></div>
          <h2 id="historyEmptyTitle">还没有历史记录</h2>
          <p id="historyEmptyCopy">每过一天，当天的清单会完整留在这里。</p>
        </section>
      </section>

      <nav class="tabs" aria-label="视图切换">
        <button class="tab is-active" type="button" data-page="today" aria-current="page">今天</button>
        <button class="tab" type="button" data-page="history">历史</button>
      </nav>

      <div id="undoBar" class="undo-bar" role="status" hidden>
        <span id="undoProgress" class="undo-progress" aria-hidden="true"></span>
        <span id="undoText">已删除一项任务</span>
        <button id="undoButton" type="button">撤销</button>
      </div>

      <section id="settingsPanel" class="settings-panel" aria-label="设置" hidden>
        <div class="settings-head">
          <h2>设置</h2>
          <button id="settingsCloseButton" class="icon-button" type="button" aria-label="关闭设置" title="关闭设置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
          </button>
        </div>
        <div class="setting-row">
          <span id="windowModeLabel">窗口层级</span>
          <div id="windowModeGroup" class="segmented" role="radiogroup" aria-labelledby="windowModeLabel"></div>
        </div>
        <label class="setting-row switch-row">
          <span>关闭时隐藏到托盘</span>
          <input id="closeToTrayToggle" type="checkbox" role="switch" />
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="setting-row switch-row">
          <span>开机启动</span>
          <input id="launchAtLoginToggle" type="checkbox" role="switch" />
          <span class="switch" aria-hidden="true"></span>
        </label>
        <div class="setting-row">
          <span>数据</span>
          <div class="settings-actions">
            <button id="importButton" class="text-button" type="button">导入</button>
            <button id="exportButton" class="text-button" type="button">导出</button>
          </div>
        </div>
        <div class="setting-row">
          <span>数据目录</span>
          <button id="openFolderButton" class="text-button" type="button">打开</button>
        </div>
      </section>
    </main>

    <script src="view-model.js"></script>
    <script src="app.js"></script>
  </body>
</html>
